<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0908" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>KAYISI RAGE — Ripe &amp; Ruthless</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='37' r='21' fill='%23f0952f'/%3E%3Cpath d='M32 17c5-8 13-8 17-4-5 2-8 5-9 9z' fill='%236f9b3a'/%3E%3Cpath d='M32 17v-6' stroke='%235c3b17' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
  <canvas id="scene" aria-label="3D fight scene: a muscular anthropomorphic apricot battling two opponents"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div id="hud">
    <header class="brand">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">&#9670;</span>
        <h1>KAYISI<span>RAGE</span></h1>
      </div>
      <p class="tagline">OLGUN &middot; ÖFKELİ &middot; YENİLMEZ</p>
    </header>

    <div class="top-tools">
      <button id="btn-motion" class="tool" type="button" aria-pressed="false" aria-label="Enable motion tilt camera">
        <span class="tool-dot"></span><span class="tool-label">TILT CAM</span>
      </button>
      <button id="btn-cinema" class="tool" type="button" aria-pressed="true" aria-label="Toggle cinematic camera">
        <span class="tool-label">CINEMA</span>
      </button>
    </div>

    <div class="combo" id="combo" aria-live="polite">
      <span class="combo-label">CHAOS</span>
      <span class="combo-value" id="combo-value">x0</span>
    </div>

    <div class="weapon-chip" id="weapon-chip">
      <span class="weapon-index" id="weapon-index">01</span>
      <span class="weapon-name" id="weapon-name">BAT</span>
      <span class="weapon-tick">IN HAND</span>
    </div>

    <div class="stick-zone" id="stick-zone" aria-label="Movement joystick">
      <div class="stick-base">
        <div class="stick-ring"></div>
        <div class="stick-knob" id="stick-knob"></div>
        <span class="stick-dir dir-n">W</span>
        <span class="stick-dir dir-s">S</span>
        <span class="stick-dir dir-w">A</span>
        <span class="stick-dir dir-e">D</span>
      </div>
      <span class="stick-caption">MOVE</span>
    </div>

    <div class="actions">
      <button id="btn-swap" class="action action-small" type="button" aria-label="Switch weapon">
        <span class="action-key">SWAP</span>
        <span class="action-sub">WEAPON</span>
      </button>
      <button id="btn-strike" class="action action-main" type="button" aria-label="Strike">
        <span class="strike-glyph" aria-hidden="true"></span>
        <span class="action-key">STRIKE</span>
      </button>
      <button id="btn-slam" class="action action-small" type="button" aria-label="Ground slam">
        <span class="action-key">SLAM</span>
        <span class="action-sub">SHOCK</span>
      </button>
    </div>

    <p class="hint" id="hint">DRAG TO ORBIT &nbsp;·&nbsp; WASD TO MOVE &nbsp;·&nbsp; SPACE TO STRIKE &nbsp;·&nbsp; Q TO SWAP</p>
    <p class="toast" id="toast" role="status"></p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
